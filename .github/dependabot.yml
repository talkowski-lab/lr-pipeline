version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/dockerfiles"
    schedule:
      interval: "weekly"
    ignore:
      # Private base images
      - dependency-name: "us-central1-docker.pkg.dev/*"
      # Ubuntu stays on an LTS release bumped by hand; every Ubuntu bump changes the apt-installed tool versions
      - dependency-name: "ubuntu"
      # Major bumps change the OS or tool versions the pins and installs assume; bump these by hand
      - dependency-name: "ensemblorg/ensembl-vep"
        update-types: ["version-update:semver-major"]
      - dependency-name: "hailgenetics/hail"
        update-types: ["version-update:semver-major"]
      # l1meaid depends on this image's RepeatMasker and Dfam releases
      - dependency-name: "dfam/tetools"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      docker-base-images:
        patterns:
          - "*"
