name: Agents Sync Check

on:
  push:
    branches: [ '**', '!dependabot/**' ]
    paths:
      - 'AGENTS.md'
      - '.claude/CLAUDE.md'
      - '.github/copilot-instructions.md'
      - '.github/workflows/agents-sync-check.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'AGENTS.md'
      - '.claude/CLAUDE.md'
      - '.github/copilot-instructions.md'
      - '.github/workflows/agents-sync-check.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  agents_sync_check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: Agents Sync Check
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.10
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.10"

      - name: Check AGENTS.md <-> CLAUDE.md/copilot-instructions.md sync
        run: |
          python .github/scripts/check_agents_sync.py
