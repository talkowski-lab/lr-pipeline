name: Workflows Doc Sync

on:
  push:
    branches: [ '**', '!dependabot/**' ]
    paths:
      - 'wdl/**'
      - 'archive/wdl/**'
      - '.dockstore.yml'
      - '.github/scripts/wdl_meta.py'
      - '.github/scripts/generate_workflows_doc.py'
      - '.github/workflows/workflows-doc-sync.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'wdl/**'
      - 'archive/wdl/**'
      - '.dockstore.yml'
      - '.github/scripts/wdl_meta.py'
      - '.github/scripts/generate_workflows_doc.py'
      - '.github/workflows/workflows-doc-sync.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: Check Workflow Documentation
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.10
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.10"

      - name: Check the meta and parameter_meta blocks the document is built from
        run: |
          python .github/scripts/check_wdl_style.py

      # The document is regenerated and committed on push to main, so a stale copy on a
      # branch or pull request is not an error; only a document that cannot be built is
      # archive/ is excluded from check_wdl_style.py, so the generator parsing its retired
      # workflows is what guards that archive/docs/workflows.md still builds
      - name: Confirm the workflow documents can be generated
        run: |
          python .github/scripts/generate_workflows_doc.py --dry-run
          python .github/scripts/generate_workflows_doc.py --site archive --dry-run

  generate:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # The deploy key is a secret of this environment, which only main can deploy to
    environment: docs-sync
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: Generate Workflow Documentation
    steps:
      # The write deploy key is the ruleset's bypass actor for the pull-request rule on main
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ssh-key: ${{ secrets.DOCS_DEPLOY_KEY }}

      - name: Set up Python 3.10
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.10"

      - name: Regenerate the workflow documents
        run: |
          python .github/scripts/generate_workflows_doc.py
          python .github/scripts/generate_workflows_doc.py --site archive

      # The commit touches only the generated documents, which are outside this workflow's trigger paths, so it cannot loop
      - name: Commit the workflow documents when they changed
        run: |
          if git diff --quiet -- docs/workflows.md archive/docs/workflows.md; then
            echo "The workflow documents are already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/workflows.md archive/docs/workflows.md
          git commit -m "Regenerate the workflow documents"
          git push
