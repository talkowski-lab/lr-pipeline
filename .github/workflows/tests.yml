name: Tests

on:
  push:
    branches: [ main ]
    paths:
      - 'wdl/**'
      - 'scripts/**'
      - 'tests/**'
      - 'dockerfiles/Dockerfile.utils'
      - 'dockerfiles/versions.env'
      - 'dockerfiles/build_args.sh'
      - '.github/scripts/**'
      - 'pyproject.toml'
      - '.github/workflows/tests.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'wdl/**'
      - 'scripts/**'
      - 'tests/**'
      - 'dockerfiles/Dockerfile.utils'
      - 'dockerfiles/versions.env'
      - 'dockerfiles/build_args.sh'
      - '.github/scripts/**'
      - 'pyproject.toml'
      - '.github/workflows/tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python 3.10
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.10"
        cache: pip
        cache-dependency-path: pyproject.toml

    - name: Install test dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[test]"

    - name: Run unit tests
      run: pytest tests/unit

  wdl:
    name: WDL smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python 3.10
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.10"
        cache: pip
        cache-dependency-path: pyproject.toml

    - name: Install test dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[test]"

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - name: Resolve utils image build arguments
      id: build_args
      run: |
        {
          echo "args<<EOF"
          dockerfiles/build_args.sh utils
          echo "EOF"
        } >> "$GITHUB_OUTPUT"

    - name: Build utils image
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        file: dockerfiles/Dockerfile.utils
        load: true
        tags: utils:ci
        build-args: ${{ steps.build_args.outputs.args }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Run WDL smoke tests
      env:
        UTILS_DOCKER: utils:ci
      run: pytest -m wdl tests/wdl
