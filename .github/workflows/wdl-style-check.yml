name: WDL Style Check

on:
  push:
    branches: [ main ]
    paths:
      - 'wdl/**'
      - '.github/scripts/check_wdl_style.py'
      - '.github/scripts/wdl_meta.py'
      - '.github/workflows/wdl-style-check.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'wdl/**'
      - '.github/scripts/check_wdl_style.py'
      - '.github/scripts/wdl_meta.py'
      - '.github/workflows/wdl-style-check.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  wdl_style_check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: WDL Style Check
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.10
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.10"

      - name: Check WDL style against docs/conventions.md
        run: |
          python .github/scripts/check_wdl_style.py
