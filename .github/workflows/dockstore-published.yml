name: Dockstore Published Check

on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.dockstore.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dockstore_published_check:
    runs-on: ubuntu-latest
    name: Dockstore Published Check
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python 3.10
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Check every workflow is published on Dockstore
        if: github.event_name != 'push'
        run: |
          python .github/scripts/check_dockstore_published.py

      - name: Wait for Dockstore to sync this push
        if: github.event_name == 'push'
        run: sleep 300

      - name: Check every workflow is published, tolerating entries added by this push
        if: github.event_name == 'push'
        run: |
          python .github/scripts/check_dockstore_published.py --added-since ${{ github.event.before }}
