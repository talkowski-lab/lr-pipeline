name: Dockstore Sync Check

on:
  push:
    branches: [ '**', '!dependabot/**' ]
    paths:
      - 'wdl/**'
      - '.dockstore.yml'
      - '.github/workflows/dockstore-sync.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'wdl/**'
      - '.dockstore.yml'
      - '.github/workflows/dockstore-sync.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  dockstore_sync_check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: Dockstore Sync Check
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.10
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Check .dockstore.yml <-> wdl/ sync
        run: |
          python .github/scripts/check_dockstore_sync.py

      - name: Check no feature branch filters remain on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          python .github/scripts/check_dockstore_sync.py --main-only
