name: Python Lint (ruff)

on:
  push:
    branches: [ '**', '!dependabot/**' ]
    paths:
      - 'scripts/**'
      - '.github/scripts/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/python-lint.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'scripts/**'
      - '.github/scripts/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/python-lint.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  linting:
    name: Linting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python 3.10
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.10"
        cache: pip
        cache-dependency-path: pyproject.toml

    # The pin lives only in the pyproject.toml dev extra, which is what Dependabot bumps
    - name: Install ruff
      run: |
        python -m pip install --upgrade pip
        pin="$(grep -oE '"ruff==[^"]+"' pyproject.toml | tr -d '"')"
        if [[ "$(wc -l <<< "${pin}")" -ne 1 || -z "${pin}" ]]; then
          echo "Expected exactly one ruff== pin in pyproject.toml, found: ${pin}" >&2
          exit 1
        fi
        pip install "${pin}"

    - name: Lint with ruff
      run: |
        ruff check scripts .github/scripts tests

    - name: Check formatting with ruff
      run: |
        ruff format --check scripts .github/scripts tests
