[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lr-pipeline"
version = "0.1.0"
description = "WDL workflows for generating, phasing and annotating long-read variant callsets on Cromwell/Terra"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
# Dependencies of the scripts under scripts/ that run outside the Hail images
dependencies = [
    "edlib>=1.3",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.0",
    "pysam>=0.22",
]

[project.optional-dependencies]
test = ["miniwdl>=1.12", "pytest>=8", "pyyaml>=6"]
dev = ["lr-pipeline[test]", "ruff==0.17.1"]

[project.urls]
Repository = "https://github.com/talkowski-lab/lr-pipeline"

[tool.setuptools]
packages = []

[tool.ruff]
line-length = 130
target-version = "py39"
extend-exclude = ["archive", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]

[tool.ruff.format]
# Vendored from GATK-SV; left unformatted so diffs against upstream stay readable
exclude = ["scripts/helper/estimated_CN_denoising.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["wdl: runs a workflow under miniwdl in a container; needs UTILS_DOCKER"]
